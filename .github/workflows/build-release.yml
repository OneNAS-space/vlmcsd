permissions:
  contents: write
name: Build OpenWrt Package

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Check And Calculate PKG_MIRROR_HASH"]
    types:
      - completed

jobs:
  check:
    name: 1. Resolve & Fingerprint
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Check And Calculate PKG_MIRROR_HASH')
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      resolved_tag: ${{ steps.version.outputs.full_version }}
      pkg_version: ${{ steps.version.outputs.version }}
    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🔎 Decide whether build is needed
        id: decide
        env:
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          SHOULD_BUILD="true"
          # 提取指纹 FP
          FP=$(echo "$COMMIT_MSG" | sed -n 's/.*FP=\([0-9a-f]\{64\}\).*/\1/p')
          
          if [ -n "$FP" ] && [ -f .last-fingerprint ]; then
            LAST=$(cat .last-fingerprint)
            if [ "$FP" = "$LAST" ]; then
              echo "Fingerprint unchanged ($FP). Skipping."
              SHOULD_BUILD="false"
            fi
          fi
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

      - name: 📦 Extract Version from Makefile
        id: version
        if: steps.decide.outputs.should_build == 'true'
        run: |
          # 提取版本号逻辑 (带 fallback)
          V=$(grep -E '^PKG_VERSION *:?=' Makefile | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$V" ]; then
            SD=$(grep -E '^PKG_SOURCE_DATE *:?=' Makefile | head -n1 | cut -d= -f2 | tr -d '[:space:]')
            SV=$(grep -E '^PKG_SOURCE_VERSION *:?=' Makefile | head -n1 | cut -d= -f2 | tr -d '[:space:]' | cut -c1-8)
            V="${SD//-/.}.${SV}"
          fi
          R=$(grep -E '^PKG_RELEASE *:?=' Makefile | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "full_version=$V-r$R" >> "$GITHUB_OUTPUT"

  build:
    name: 2. Build (${{ matrix.target }} / ${{ matrix.version }})
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: openwrt-24.10
            target: x86_64
          - version: openwrt-24.10
            target: aarch64_cortex-a53
          - version: openwrt-24.10
            target: arm_cortex-a7_neon-vfpv4
          - version: openwrt-25.12
            target: x86_64
          - version: openwrt-25.12
            target: aarch64_cortex-a53
          - version: openwrt-25.12
            target: arm_cortex-a7_neon-vfpv4

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v6

      - name: 📛 Set Environment
        run: |
          echo "PKG_NAME=${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          echo "ARCH=${{ matrix.target }}-${{ matrix.version }}" >> "$GITHUB_ENV"

      - name: 🧰 Set up vlmcsd feed structure
        run: |
          set -e
          mkdir -p feed/jackie264
          printf 'include $(TOPDIR)/feed/jackie264/*/Makefile\n' > feed/jackie264/custom.mk

          rsync -av \
            --exclude='.git/' \
            --exclude='feed/' \
            --exclude='.github/' \
            --exclude='LICENSE' \
            --exclude='README.md' \
            --exclude='SECURITY.md' \
            ./ feed/jackie264/${PKG_NAME}/

      - name: 🏗️ Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@v10
        env:
          ARCH: ${{ env.ARCH }}
          FEEDNAME: jackie264
          PACKAGES: ${{ env.PKG_NAME }}
          INDEX: 0
          FEED_DIR: ${{ github.workspace }}/feed
          NO_SHFMT_CHECK: 1
          NO_REFRESH_CHECK: 1
          
      - name: 🔍 Debug build output
        run: |
          echo "=== Build directory structure ==="
          find . -name "*.ipk" -type f 2>/dev/null || echo "No .ipk files found"
          echo "=== bin directory structure ==="
          ls -la bin/ 2>/dev/null || echo "No bin directory found"
          if [ -d "bin/packages" ]; then
            echo "=== packages directory structure ==="
            find bin/packages/ -type f -name "*.ipk" 2>/dev/null || echo "No .ipk files in packages directory"
            echo "=== Full packages directory tree ==="
            ls -laR bin/packages/ 2>/dev/null || echo "No packages directory"
          fi

      - name: 📦 Prepare and Rename APK artifacts
        run: |
          # 仅处理 25.12 产生的 APK 文件
          find bin/packages/ -name "*.apk" | while read -r f; do
            # vlmcsd-2026.02.18.apk -> vlmcsd-2026.02.18-${{ matrix.target }}.apk
            mv "$f" "${f%.apk}-${{ matrix.target }}.apk"
          done

      - name: 📦 Upload artifact for ${{ matrix.target }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG_NAME }}-${{ matrix.target }}-${{ matrix.version }}
          path: |
            bin/packages/*/jackie264/${{ env.PKG_NAME }}*.ipk
            bin/packages/*/jackie264/${{ env.PKG_NAME }}*.apk
          if-no-files-found: ignore

  release:
    name: 3. Release & Deploy ${{ github.repository }}
    needs: [check, build]
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v6

      - name: ⬇️ Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release-assets

      - name: 🗃️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.resolved_tag }}
          name: Build-v${{ needs.check.outputs.pkg_version }}
          files: |
            ./release-assets/**/*.ipk
            ./release-assets/**/*.apk
          draft: false
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔑 Checkout custom-packages repo
        uses: actions/checkout@v6
        with:
          repository: OneNAS-space/custom-packages
          token: ${{ secrets.CUSTOM_PACKAGES_TOKEN }}
          path: custom-packages

      - name: 🚚 Update vlmcsd artifacts
        run: |
          set -e
          PKG_NAME="${{ github.event.repository.name }}"

          find ./release-assets -type f \( -name "*.ipk" -o -name "*.apk" \) | while read -r f; do
            base=$(basename "$f")
            archdir=$(echo "$f" | sed -E 's#.*/vlmcsd-([^/]+)-openwrt.*#\1#')
            if [[ "$base" == *.ipk ]]; then
              pkgname=$(echo "$base" | sed -E 's/^([^_]+)_.*$/\1/')
              mkdir -p "custom-packages/24.10/$archdir"
              echo "Cleaning old versions of $pkgname in $archdir"
              rm -f "custom-packages/24.10/$archdir/${pkgname}"*.ipk
              echo "Deploying $base to 24.10/$archdir/"
              cp "$f" "custom-packages/24.10/$archdir/"
            elif [[ "$base" == *.apk ]]; then
              standard_name=$(echo "$base" | sed "s/-$archdir//")
              pkgname=$(echo "$standard_name" | cut -d- -f1)
              mkdir -p "custom-packages/25.12/$archdir"
              echo "Cleaning old versions of $pkgname in $archdir"
              rm -f "custom-packages/25.12/$archdir/${pkgname}"*.ipk
              echo "Deploying $base to 25.12/$archdir/"
              cp "$f" "custom-packages/25.12/$archdir/"
            fi
          done
          echo "=== 24.10 Content ==="
          ls -la custom-packages/24.10/$archdir/${PKG_NAME}* || echo "No IPKs found"
          echo "=== 25.12 Content ==="
          ls -la custom-packages/25.12/$archdir/${PKG_NAME}* || echo "No APKs found"

          cd custom-packages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 24.10/$archdir 25.12/$archdir 2>/dev/null || true
          git commit -m "Update $PKG_NAME to v${{ needs.check.outputs.resolved_tag }}" || exit 0
          
          for i in {1..5}; do
            git pull --rebase origin main && \
            git push origin main && break || \
            (echo "Conflict detected, retrying in 5s..." && sleep 5)
          done
